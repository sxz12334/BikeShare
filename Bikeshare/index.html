<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f70">
  <title>BikeShare CSU</title>
  <style>

    :root {
      color-scheme: light;
      --bg: #f3f7f5;
      --surface: #fff;
      --surface-soft: #eaf5f1;
      --text: #152b27;
      --muted: #60736d;
      --line: #dce8e2;
      --green: #087f70;
      --green-dark: #056456;
      --teal: #24a99a;
      --lime: #d9f36a;
      --danger: #b94141;
      --shadow: 0 12px 32px rgb(22 57 47 / 8%);
      --radius: 20px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101b19;
      --surface: #182724;
      --surface-soft: #203832;
      --text: #eff8f4;
      --muted: #abc0b7;
      --line: #304941;
      --green: #38c1a8;
      --green-dark: #19a58f;
      --teal: #5bd0bd;
      --lime: #d9f36a;
      --danger: #ff8585;
      --shadow: 0 12px 32px rgb(0 0 0 / 20%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .app-shell { min-height: 100vh; padding-bottom: 88px; }
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px max(18px, calc((100vw - 1100px) / 2));
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 850; letter-spacing: -.03em; }
    .brand-mark {
      display: grid; width: 38px; height: 38px; place-items: center;
      color: #053f36; background: var(--lime); border-radius: 13px; font-size: 21px;
    }
    .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0; }
    .top-actions { display: flex; gap: 8px; }
    .icon-button, .button, .tab {
      min-height: 44px; border: 0; border-radius: 14px;
    }
    .icon-button { width: 44px; background: var(--surface-soft); color: var(--text); font-size: 19px; }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 20px 16px 30px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(25px, 5vw, 36px); line-height: 1.12; letter-spacing: -.04em; }
    h2 { margin-bottom: 12px; font-size: 21px; letter-spacing: -.025em; }
    h3 { margin-bottom: 6px; font-size: 16px; }
    .muted, .subheading { color: var(--muted); }
    .subheading { margin: 0; }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
    }
    .grid { display: grid; gap: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack { display: grid; gap: 14px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; background: var(--green); color: #fff;
      font-weight: 750; text-decoration: none; transition: transform .15s, opacity .15s;
    }
    .button:hover { transform: translateY(-1px); }
    .button:disabled { cursor: not-allowed; opacity: .48; transform: none; }
    .button.secondary { background: var(--surface-soft); color: var(--text); }
    .button.danger { background: var(--danger); color: white; }
    .button.small { min-height: 38px; padding: 7px 12px; border-radius: 12px; font-size: 14px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--surface-soft); color: var(--green-dark); font-size: 12px; font-weight: 750; }
    [data-theme="dark"] .pill { color: var(--teal); }
    .notice { padding: 12px 14px; background: var(--surface-soft); border-radius: 14px; color: var(--muted); font-size: 14px; }
    .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

    /* ---------- Map and stations ---------- */
    .map-layout { display: grid; gap: 16px; }
    .campus-map {
      min-height: 315px; position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--radius);
      background:
        linear-gradient(28deg, transparent 47%, color-mix(in srgb, var(--green) 12%, var(--surface)) 48% 52%, transparent 53%),
        linear-gradient(145deg, transparent 46%, color-mix(in srgb, var(--teal) 12%, var(--surface)) 47% 51%, transparent 52%),
        repeating-linear-gradient(90deg, transparent 0 62px, color-mix(in srgb, var(--line) 75%, transparent) 63px 65px),
        repeating-linear-gradient(0deg, transparent 0 62px, color-mix(in srgb, var(--line) 75%, transparent) 63px 65px),
        var(--surface-soft);
    }
    .map-label { position: absolute; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .map-label.csu { top: 12px; left: 14px; }
    .map-label.green { right: 12px; bottom: 10px; }
    .station-pin {
      position: absolute; z-index: 1; display: grid; justify-items: center; gap: 3px;
      border: 0; background: none; color: var(--text); transform: translate(-50%, -50%);
    }
    .pin-dot {
      display: grid; width: 42px; height: 42px; place-items: center;
      border: 3px solid var(--surface); border-radius: 50%;
      background: var(--green); color: white; font-size: 13px; font-weight: 900;
      box-shadow: 0 3px 12px rgb(0 0 0 / 20%);
    }
    .station-pin.selected .pin-dot { outline: 3px solid var(--lime); }
    .pin-name { padding: 2px 6px; border-radius: 7px; background: var(--surface); font-size: 10px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 6px rgb(0 0 0 / 9%); }
    .station-list { display: grid; gap: 10px; }
    .station-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
    .station-card.selected { border-color: var(--green); box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 16%, transparent); }
    .station-card p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .view-toggle { display: flex; gap: 6px; padding: 4px; background: var(--surface-soft); border-radius: 14px; }
    .view-toggle button { padding: 7px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 700; }
    .view-toggle button.active { background: var(--surface); color: var(--text); }

    /* ---------- Ride, routes, history, profile ---------- */
    .ride-clock { margin: 12px 0 2px; font-size: clamp(40px, 12vw, 64px); font-weight: 850; letter-spacing: -.06em; line-height: 1; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat { padding: 13px; border-radius: 15px; background: var(--surface-soft); }
    .stat strong { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .route-card { display: grid; gap: 9px; }
    .route-line { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 14px; }
    .route-line .line { width: 26px; border-top: 2px dashed var(--teal); }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; }
    .tag-filter { min-height: 38px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); }
    .tag-filter.active { border-color: var(--green); background: var(--green); color: white; }
    .form-grid { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 750; }
    input, select, textarea {
      width: 100%; min-height: 46px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); color: var(--text);
    }
    textarea { min-height: 82px; resize: vertical; }
    .check-row { display: flex; align-items: flex-start; gap: 10px; color: var(--muted); font-size: 14px; }
    .check-row input { width: 20px; min-height: 20px; margin: 2px 0 0; accent-color: var(--green); }
    .ride-row, .maintenance-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .ride-row:last-child, .maintenance-row:last-child { border-bottom: 0; }
    .ride-row p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .admin-chart { width: 100%; height: 200px; display: block; }
    .privacy { font-size: 13px; color: var(--muted); }
    .bottom-nav {
      position: fixed; z-index: 10; inset: auto 0 0;
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 7px max(8px, calc((100vw - 620px) / 2)) max(8px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); background: var(--surface);
      box-shadow: 0 -8px 24px rgb(20 50 42 / 7%);
    }
    .tab { display: grid; align-content: center; justify-items: center; gap: 1px; min-height: 58px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 700; }
    .tab .tab-icon { font-size: 19px; line-height: 1.2; }
    .tab.active { color: var(--green); }
    dialog {
      width: min(480px, calc(100% - 28px)); padding: 0;
      border: 1px solid var(--line); border-radius: 22px;
      background: var(--surface); color: var(--text); box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgb(5 26 22 / 55%); backdrop-filter: blur(3px); }
    .dialog-body { padding: 20px; }
    .toast {
      position: fixed; z-index: 20; left: 50%; bottom: 96px; transform: translateX(-50%);
      width: max-content; max-width: calc(100% - 32px); padding: 12px 16px;
      border-radius: 14px; background: var(--text); color: var(--surface);
      box-shadow: var(--shadow); font-size: 14px;
    }
    [hidden] { display: none !important; }

    @media (min-width: 700px) {
      main { padding: 28px 24px 40px; }
      .map-layout { grid-template-columns: 1.15fr .85fr; align-items: start; }
      .campus-map { min-height: 460px; }
      .station-list { max-height: 460px; overflow: auto; }
      .form-grid.two { grid-template-columns: 1fr 1fr; }
      .route-grid { grid-template-columns: repeat(2, 1fr); }
      .history-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 920px) {
      .dashboard-grid { grid-template-columns: 1fr 1fr; }
      .profile-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🚲</span>
        <span>BikeShare CSU<small>Caraga State University · Butuan City</small></span>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="themeButton" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="tab active" data-tab="map"><span class="tab-icon">⌖</span>Map</button>
      <button class="tab" data-tab="ride"><span class="tab-icon">🚲</span>Ride</button>
      <button class="tab" data-tab="routes"><span class="tab-icon">↗</span>Routes</button>
      <button class="tab" data-tab="history"><span class="tab-icon">◷</span>History</button>
      <button class="tab" data-tab="profile"><span class="tab-icon">☺</span>Profile</button>
    </nav>
  </div>

  <dialog id="modal"><div class="dialog-body" id="modalBody"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    /* ---------- Demo data and local persistence ---------- */
    const initialData = {
      stations: [
        { id: "gate", name: "Main Gate", detail: "University entrance", bikes: 5, x: 17, y: 30 },
        { id: "library", name: "Library", detail: "Learning Commons", bikes: 4, x: 46, y: 22 },
        { id: "engineering", name: "Engineering Building", detail: "College of Engineering", bikes: 3, x: 73, y: 42 },
        { id: "gym", name: "Gymnasium", detail: "Sports & recreation", bikes: 6, x: 35, y: 69 },
        { id: "dorm", name: "Dormitory Area", detail: "Student residences", bikes: 2, x: 78, y: 77 }
      ],
      bikes: [
        { id: "CSU-001", station: "gate", status: "Available" }, { id: "CSU-002", station: "gate", status: "Available" },
        { id: "CSU-003", station: "gate", status: "Available" }, { id: "CSU-004", station: "gate", status: "Available" },
        { id: "CSU-005", station: "gate", status: "Maintenance" },
        { id: "CSU-006", station: "library", status: "Available" }, { id: "CSU-007", station: "library", status: "Available" },
        { id: "CSU-008", station: "library", status: "Available" }, { id: "CSU-009", station: "library", status: "Available" },
        { id: "CSU-010", station: "engineering", status: "Available" }, { id: "CSU-011", station: "engineering", status: "Available" },
        { id: "CSU-012", station: "engineering", status: "Available" },
        { id: "CSU-013", station: "gym", status: "Available" }, { id: "CSU-014", station: "gym", status: "Available" },
        { id: "CSU-015", station: "gym", status: "Available" }, { id: "CSU-016", station: "gym", status: "Available" },
        { id: "CSU-017", station: "gym", status: "Available" }, { id: "CSU-018", station: "gym", status: "Available" },
        { id: "CSU-019", station: "dorm", status: "Available" }, { id: "CSU-020", station: "dorm", status: "Maintenance" }
      ],
      routes: [
        { id: 1, title: "Shady Library Loop", start: "Main Gate", end: "Library", tags: ["shaded", "shortcut"], votes: 18 },
        { id: 2, title: "Well-lit Evening Ride", start: "Dormitory Area", end: "Gymnasium", tags: ["safe at night", "flat"], votes: 14 },
        { id: 3, title: "Engineering Express", start: "Main Gate", end: "Engineering Building", tags: ["shortcut", "flat"], votes: 12 },
        { id: 4, title: "Tree-lined Campus Way", start: "Library", end: "Gymnasium", tags: ["shaded", "safe at night"], votes: 9 },
        { id: 5, title: "Easy Dorm Commute", start: "Dormitory Area", end: "Library", tags: ["flat", "shaded"], votes: 8 },
        { id: 6, title: "Gym-to-Gate Quick Route", start: "Gymnasium", end: "Main Gate", tags: ["shortcut", "flat"], votes: 7 },
        { id: 7, title: "Quiet Morning Path", start: "Engineering Building", end: "Library", tags: ["shaded", "safe at night"], votes: 6 },
        { id: 8, title: "Campus Greenway", start: "Dormitory Area", end: "Main Gate", tags: ["flat", "shaded"], votes: 5 }
      ],
      rides: [
        { from: "Main Gate", to: "Library", date: "2026-11-18", minutes: 12, distance: 1.1 },
        { from: "Dormitory Area", to: "Gymnasium", date: "2026-11-17", minutes: 24, distance: 2.2 },
        { from: "Library", to: "Engineering Building", date: "2026-11-16", minutes: 18, distance: 1.4 },
        { from: "Main Gate", to: "Gymnasium", date: "2026-11-15", minutes: 31, distance: 2.8 },
        { from: "Engineering Building", to: "Main Gate", date: "2026-11-14", minutes: 16, distance: 1.7 },
        { from: "Gymnasium", to: "Dormitory Area", date: "2026-11-12", minutes: 21, distance: 1.9 },
        { from: "Library", to: "Main Gate", date: "2026-11-11", minutes: 14, distance: 1.1 },
        { from: "Dormitory Area", to: "Library", date: "2026-11-09", minutes: 27, distance: 2.3 },
        { from: "Main Gate", to: "Engineering Building", date: "2026-11-07", minutes: 19, distance: 1.8 },
        { from: "Gymnasium", to: "Library", date: "2026-11-05", minutes: 22, distance: 1.6 }
      ],
      voted: [],
      waiverAccepted: false,
      activeRide: null,
      summary: null,
      theme: "light"
    };

    let data;
    try {
      data = { ...initialData, ...JSON.parse(localStorage.getItem("bikeshare-csu") || "{}") };
      // Keep newly added demo fields compatible with an older saved prototype.
      for (const key of ["stations", "bikes", "routes", "rides", "voted"]) {
        if (!Array.isArray(data[key])) data[key] = initialData[key];
      }
    } catch { data = structuredClone(initialData); }

    let currentTab = "map";
    let selectedStation = data.stations[0].id;
    let stationView = "map";
    let routeFilter = "all";
    let rideInterval = null;
    const main = document.querySelector("#main");

    function save() {
      localStorage.setItem("bikeshare-csu", JSON.stringify(data));
    }
    function esc(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function stationName(id) {
      return data.stations.find(s => s.id === id)?.name || id;
    }
    function availableAt(stationId) {
      return data.bikes.filter(b => b.station === stationId && b.status === "Available").length;
    }
    function money(minutes) {
      return minutes <= 30 ? 0 : Math.ceil((minutes - 30) / 15) * 5;
    }
    function elapsedSeconds() {
      return data.activeRide ? Math.max(0, Math.floor((Date.now() - data.activeRide.startedAt) / 1000)) : 0;
    }
    function fmtTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
    }
    function toast(message) {
      const el = document.querySelector("#toast");
      el.textContent = message;
      el.hidden = false;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.hidden = true, 2800);
    }
    function showModal(content) {
      document.querySelector("#modalBody").innerHTML = content;
      document.querySelector("#modal").showModal();
    }
    function closeModal() {
      document.querySelector("#modal").close();
    }

    /* ---------- Shared layout helpers ---------- */
    function heading(title, subtitle, extra = "") {
      return `<div class="page-heading"><div><h1>${title}</h1><p class="subheading">${subtitle}</p></div>${extra}</div>`;
    }
    function stationSelect(id, label) {
      return `<label>${label}<select name="${id}">${data.stations.map(s =>
        `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select></label>`;
    }

    /* ---------- Map and bike station view ---------- */
    function renderMap() {
      const station = data.stations.find(s => s.id === selectedStation) || data.stations[0];
      const pins = data.stations.map(s => `
        <button class="station-pin ${s.id === selectedStation ? "selected" : ""}" data-select-station="${esc(s.id)}"
          style="left:${s.x}%;top:${s.y}%" aria-label="${esc(s.name)}, ${availableAt(s.id)} bikes available">
          <span class="pin-dot">${availableAt(s.id)}</span><span class="pin-name">${esc(s.name)}</span>
        </button>`).join("");
      const stationCards = data.stations.map(s => `
        <div class="station-card ${s.id === selectedStation ? "selected" : ""}">
          <div><h3>${esc(s.name)}</h3><p>${esc(s.detail)}</p></div>
          <div style="text-align:right"><span class="pill">${availableAt(s.id)} bikes</span>
            <button class="button small" style="margin-top:8px" data-rent-at="${esc(s.id)}" ${availableAt(s.id) ? "" : "disabled"}>Choose</button></div>
        </div>`).join("");
      return `${heading("Find a bike", "Choose a station around campus to see bike availability.",
        `<div class="view-toggle"><button data-view="map" class="${stationView === "map" ? "active" : ""}">Map</button><button data-view="list" class="${stationView === "list" ? "active" : ""}">List</button></div>`)}
        <div class="notice" style="margin-bottom:14px">📍 Sample campus map · This prototype does not use GPS.</div>
        <div class="map-layout">
          ${stationView === "map" ? `<div class="campus-map" aria-label="Illustrated campus map">
            <span class="map-label csu">Caraga State University</span><span class="map-label green">Campus greenway</span>${pins}</div>` : ""}
          <div class="station-list">${stationCards}</div>
        </div>
        <section class="card" style="margin-top:16px">
          <div class="row"><div><span class="pill">Selected station</span><h2 style="margin:9px 0 2px">${esc(station.name)}</h2><span class="muted">${availableAt(station.id)} bikes ready to ride</span></div>
          <button class="button" data-rent-at="${esc(station.id)}" ${availableAt(station.id) ? "" : "disabled"}>Rent a bike</button></div>
        </section>`;
    }

    /* ---------- Rental flow and live ride ---------- */
    function renderRide() {
      if (data.activeRide) {
        const ride = data.activeRide;
        const seconds = elapsedSeconds();
        const minutes = Math.floor(seconds / 60);
        return `${heading("Your ride", "Enjoy the ride. Return your bicycle at any BikeShare CSU station.")}
          <div class="grid dashboard-grid">
            <section class="card">
              <span class="pill">● Ride in progress</span>
              <div class="ride-clock" id="rideClock">${fmtTime(seconds)}</div>
              <p class="muted">Elapsed time · ${esc(ride.bikeId)}</p>
              <div class="stat-grid"><div class="stat"><strong id="rideCost">₱${money(minutes)}</strong><span>Estimated cost</span></div><div class="stat"><strong>First 30 min</strong><span>Free</span></div></div>
            </section>
            <section class="card stack">
              <div><span class="muted">Started at</span><h2 style="margin:2px 0">${esc(stationName(ride.from))}</h2></div>
              <div class="notice">🪖 Helmet on, please. Keep to campus paths and park at a designated station.</div>
              <label>Return station<select id="returnStation">${data.stations.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select></label>
              <button class="button" data-action="return-ride">Finish and return bike</button>
              <button class="button secondary" data-action="report">Report a problem</button>
            </section>
          </div>`;
      }
      const station = data.stations.find(s => s.id === selectedStation) || data.stations[0];
      const bikes = data.bikes.filter(b => b.station === station.id && b.status === "Available");
      return `${heading("Ready to ride?", "Pick a station and bike to begin your campus trip.")}
        <section class="card stack">
          <div class="notice">🪖 <strong>Helmet reminder:</strong> Wear a properly fitted helmet and follow campus road-safety rules.</div>
          ${!data.waiverAccepted ? `<label class="check-row"><input type="checkbox" id="waiver"> <span>I have read and accept the demo ride waiver. I will ride carefully and use a helmet.</span></label>` : `<span class="pill">✓ Ride waiver accepted</span>`}
          <div class="form-grid two">
            <label>Pick-up station<select id="rideStation">${data.stations.map(s => `<option value="${esc(s.id)}" ${s.id === selectedStation ? "selected" : ""}>${esc(s.name)} · ${availableAt(s.id)} bikes</option>`).join("")}</select></label>
            <label>Available bicycle<select id="bikeChoice">${bikes.length ? bikes.map(b => `<option value="${esc(b.id)}">${esc(b.id)}</option>`).join("") : `<option value="">No bikes available</option>`}</select></label>
          </div>
          <div class="notice">Pricing: first 30 minutes free, then ₱5 for each additional 15-minute block.</div>
          <button class="button" data-action="start-ride" ${bikes.length ? "" : "disabled"}>${data.waiverAccepted ? "Start ride" : "Accept waiver & start ride"}</button>
          <button class="button secondary" data-action="report">Report a problem</button>
        </section>`;
    }

    function startRide() {
      const waiver = document.querySelector("#waiver");
      if (!data.waiverAccepted) {
        if (!waiver?.checked) return toast("Please accept the ride waiver before your first ride.");
        data.waiverAccepted = true;
      }
      const stationId = document.querySelector("#rideStation")?.value || selectedStation;
      const bikeId = document.querySelector("#bikeChoice")?.value;
      const bike = data.bikes.find(b => b.id === bikeId && b.station === stationId && b.status === "Available");
      if (!bike) return toast("Please choose an available bike.");
      bike.status = "In use";
      data.activeRide = { bikeId, from: stationId, startedAt: Date.now() };
      selectedStation = stationId;
      save();
      currentTab = "ride";
      render();
      toast("Ride started. Have a great trip!");
    }

    function returnRide() {
      if (!data.activeRide) return;
      const destination = document.querySelector("#returnStation")?.value || selectedStation;
      const ride = data.activeRide;
      const seconds = elapsedSeconds();
      const minutes = Math.max(1, Math.ceil(seconds / 60));
      const distance = Math.max(0.6, +(minutes * 0.095).toFixed(1)); // Simulated distance, not GPS.
      const cost = money(minutes);
      const bike = data.bikes.find(b => b.id === ride.bikeId);
      if (bike) { bike.status = "Available"; bike.station = destination; }
      const completed = {
        from: stationName(ride.from), to: stationName(destination),
        date: new Date().toISOString().slice(0, 10), minutes, distance
      };
      data.rides.unshift(completed);
      data.activeRide = null;
      data.summary = { ...completed, bikeId: ride.bikeId, cost };
      save();
      render();
      showSummary(data.summary);
    }

    function showSummary(summary) {
      showModal(`<span class="pill">Ride complete</span><h2 style="margin:12px 0 4px">Nice ride! 🎉</h2>
        <p class="muted">${esc(summary.from)} → ${esc(summary.to)}</p>
        <div class="stat-grid">
          <div class="stat"><strong>${summary.minutes} min</strong><span>Duration</span></div>
          <div class="stat"><strong>₱${summary.cost}</strong><span>Estimated cost</span></div>
          <div class="stat"><strong>${summary.distance} km</strong><span>Estimated distance</span></div>
          <div class="stat"><strong>${(summary.distance * 0.12).toFixed(2)} kg</strong><span>Estimated CO₂ saved</span></div>
        </div><button class="button" style="width:100%;margin-top:16px" data-action="close-modal">Done</button>`);
    }

    /* ---------- Community route sharing ---------- */
    const routeTags = ["shaded", "safe at night", "shortcut", "flat"];
    function renderRoutes() {
      const routes = data.routes.filter(r => routeFilter === "all" || r.tags.includes(routeFilter));
      return `${heading("Routes shared by students", "Discover a favorite path or share one with campus riders.")}
        <section class="card stack" style="margin-bottom:16px">
          <h2>Share a route</h2>
          <form id="routeForm" class="form-grid">
            <label>Route title<input name="title" maxlength="50" placeholder="e.g. Tree-lined way to class" required></label>
            <div class="form-grid two">${stationSelect("start", "Start")}${stationSelect("end", "End")}</div>
            <fieldset style="border:0;padding:0;margin:0"><legend style="font-size:13px;font-weight:750;margin-bottom:8px">Route tags</legend>
              <div class="tag-row">${routeTags.map(t => `<label class="tag"><input style="width:auto;min-height:auto" type="checkbox" name="tags" value="${esc(t)}"> ${esc(t)}</label>`).join("")}</div></fieldset>
            <button class="button" type="submit">Post route</button>
          </form>
        </section>
        <div class="row" style="margin:18px 0 12px;flex-wrap:wrap"><h2 style="margin:0">Campus routes</h2>
          <div class="tag-row"><button class="tag-filter ${routeFilter === "all" ? "active" : ""}" data-filter="all">All</button>${routeTags.map(t => `<button class="tag-filter ${routeFilter === t ? "active" : ""}" data-filter="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>
        <div class="grid route-grid">${routes.length ? routes.map(r => `<article class="card route-card">
          <div class="row"><h3>${esc(r.title)}</h3><span class="pill">↗ ${r.votes}</span></div>
          <div class="route-line"><span>${esc(r.start)}</span><span class="line"></span><span>${esc(r.end)}</span></div>
          <div class="tag-row">${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("") || `<span class="muted">No tags</span>`}</div>
          <button class="button secondary small" data-vote="${r.id}" ${data.voted.includes(r.id) ? "disabled" : ""}>${data.voted.includes(r.id) ? "✓ Voted" : "↑ Helpful route"}</button>
        </article>`).join("") : `<div class="card empty">No routes with this tag yet. Share one to get started!</div>`}</div>`;
    }

    /* ---------- Ride history and profile ---------- */
    function renderHistory() {
      const totalDistance = data.rides.reduce((n, r) => n + Number(r.distance || 0), 0);
      const saved = totalDistance * 0.12;
      return `${heading("Your ride history", "Every trip adds up to a greener campus commute.")}
        <div class="stat-grid" style="margin-bottom:16px">
          <div class="stat"><strong>${data.rides.length}</strong><span>Total rides</span></div>
          <div class="stat"><strong>${totalDistance.toFixed(1)} km</strong><span>Distance traveled</span></div>
          <div class="stat"><strong>${saved.toFixed(2)} kg</strong><span>Estimated CO₂ saved</span></div>
          <div class="stat"><strong>₱${data.rides.reduce((n, r) => n + money(r.minutes), 0)}</strong><span>Estimated total fares</span></div>
        </div>
        <div class="grid history-grid">${data.rides.length ? data.rides.map(r => `<article class="card">
          <div class="row"><strong>${esc(r.from)} → ${esc(r.to)}</strong><span class="pill">${esc(r.date)}</span></div>
          <p class="muted" style="margin:8px 0 0">${r.minutes} min · ${Number(r.distance).toFixed(1)} km · ₱${money(r.minutes)} estimated fare</p>
        </article>`).join("") : `<div class="card empty">Your completed rides will appear here.</div>`}</div>
        <p class="privacy" style="margin-top:14px">Distance and CO₂ figures are estimates for this prototype, not GPS measurements.</p>`;
    }

    function renderProfile() {
      return `${heading("Profile & settings", "A friendly campus mobility prototype.")}
        <div class="grid profile-grid">
          <section class="card stack"><div class="brand"><span class="brand-mark">☺</span><span>CSU Student<small>Student rider · Demo account</small></span></div>
            <div class="notice">Your ride waiver is ${data.waiverAccepted ? "accepted ✓" : "not yet accepted"}.</div>
            <button class="button secondary" data-action="admin">Open admin dashboard</button>
            <button class="button secondary" data-action="reset">Reset demo data</button>
          </section>
          <section class="card"><h2>Privacy & safety</h2>
            <p class="privacy">This concept handles personal information in accordance with the Data Privacy Act of 2012 (Republic Act No. 10173). This browser-only demo does not collect GPS or send data to a server.</p>
            <p class="privacy">Always wear a helmet, check your bicycle before riding, and report broken bikes or unsafe roads to campus staff.</p>
            <button class="button secondary" data-action="report">Report a problem</button>
          </section>
        </div>`;
    }

    /* ---------- Simple staff dashboard and charts ---------- */
    function renderAdmin() {
      const maintenance = data.bikes.filter(b => b.status === "Maintenance");
      const daily = [7, 11, 8, 14, 10, 17, 12];
      const popular = [...data.routes].sort((a, b) => b.votes - a.votes).slice(0, 5);
      return `${heading("Fleet dashboard", "Staff view · Demo statistics and bike status.",
        `<button class="button secondary small" data-action="student-view">← Student view</button>`)}
        <div class="grid dashboard-grid">
          <section class="card"><h2>Fleet at a glance</h2><div class="stat-grid">
            <div class="stat"><strong>${data.bikes.length}</strong><span>Total bicycles</span></div>
            <div class="stat"><strong>${data.bikes.filter(b => b.status === "Available").length}</strong><span>Available now</span></div>
            <div class="stat"><strong>${maintenance.length}</strong><span>Needs maintenance</span></div>
            <div class="stat"><strong>${data.rides.length}</strong><span>Recorded rides</span></div>
          </div></section>
          <section class="card"><h2>Rides per day <span class="muted" style="font-size:12px">· sample data</span></h2><canvas class="admin-chart" id="ridesChart" aria-label="Bar chart showing rides per day"></canvas></section>
          <section class="card"><h2>Popular shared routes</h2>${popular.map((r, i) => `<div class="ride-row"><div><strong>${i + 1}. ${esc(r.title)}</strong><p>${esc(r.start)} → ${esc(r.end)}</p></div><span class="pill">↑ ${r.votes}</span></div>`).join("")}</section>
          <section class="card"><h2>Station fleet status</h2>${data.stations.map(s => `<div class="ride-row"><div><strong>${esc(s.name)}</strong><p>${data.bikes.filter(b => b.station === s.id && b.status === "Maintenance").length} needing maintenance</p></div><span class="pill">${availableAt(s.id)} available</span></div>`).join("")}</section>
          <section class="card"><h2>Maintenance queue</h2>${maintenance.length ? maintenance.map(b => `<div class="maintenance-row"><div><strong>${esc(b.id)}</strong><div class="muted">${esc(stationName(b.station))}</div></div><button class="button small" data-maintenance="${esc(b.id)}">Mark ready</button></div>`).join("") : `<p class="muted">No bikes awaiting maintenance.</p>`}</section>
        </div>`;
    }

    /* ---------- App rendering and interactions ---------- */
    function render() {
      document.documentElement.dataset.theme = data.theme || "light";
      document.querySelector("#themeButton").textContent = data.theme === "dark" ? "☀" : "☾";
      document.querySelector(".bottom-nav").hidden = currentTab === "admin";
      if (currentTab === "admin") main.innerHTML = renderAdmin();
      else {
        const views = { map: renderMap, ride: renderRide, routes: renderRoutes, history: renderHistory, profile: renderProfile };
        main.innerHTML = views[currentTab]();
        document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.tab === currentTab));
      }
      if (data.activeRide) startRideClock();
      else clearInterval(rideInterval);
      if (currentTab === "admin") drawChart();
    }

    function startRideClock() {
      clearInterval(rideInterval);
      rideInterval = setInterval(() => {
        if (!data.activeRide || currentTab !== "ride") return;
        const seconds = elapsedSeconds();
        const clock = document.querySelector("#rideClock");
        const cost = document.querySelector("#rideCost");
        if (clock) clock.textContent = fmtTime(seconds);
        if (cost) cost.textContent = `₱${money(Math.floor(seconds / 60))}`;
      }, 1000);
    }

    function drawChart() {
      const canvas = document.querySelector("#ridesChart");
      if (!canvas) return;
      const ratio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 320;
      const height = canvas.clientHeight || 200;
      canvas.width = width * ratio; canvas.height = height * ratio;
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      const styles = getComputedStyle(document.documentElement);
      const muted = styles.getPropertyValue("--muted").trim();
      const green = styles.getPropertyValue("--green").trim();
      const line = styles.getPropertyValue("--line").trim();
      const values = [7, 11, 8, 14, 10, 17, 12];
      const labels = ["M", "T", "W", "T", "F", "S", "S"];
      const pad = { l: 26, r: 8, t: 12, b: 25 };
      const chartH = height - pad.t - pad.b;
      ctx.font = "11px system-ui"; ctx.textAlign = "right"; ctx.fillStyle = muted;
      for (let n = 0; n <= 20; n += 5) {
        const y = pad.t + chartH - n / 20 * chartH;
        ctx.strokeStyle = line; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(width - pad.r, y); ctx.stroke();
        ctx.fillText(n, pad.l - 6, y + 4);
      }
      const step = (width - pad.l - pad.r) / values.length;
      values.forEach((value, i) => {
        const barW = step * .52;
        const x = pad.l + step * i + (step - barW) / 2;
        const barH = value / 20 * chartH;
        ctx.fillStyle = green;
        ctx.beginPath(); ctx.roundRect(x, pad.t + chartH - barH, barW, barH, 5); ctx.fill();
        ctx.textAlign = "center"; ctx.fillStyle = muted; ctx.fillText(labels[i], x + barW / 2, height - 7);
      });
    }

    document.querySelector(".bottom-nav").addEventListener("click", event => {
      const tab = event.target.closest("[data-tab]");
      if (!tab) return;
      currentTab = tab.dataset.tab;
      render();
    });

    document.querySelector("#themeButton").addEventListener("click", () => {
      data.theme = data.theme === "dark" ? "light" : "dark";
      save(); render();
    });

    main.addEventListener("change", event => {
      if (event.target.id === "rideStation") {
        selectedStation = event.target.value;
        render();
      }
    });

    main.addEventListener("click", event => {
      const stationButton = event.target.closest("[data-select-station]");
      const rentButton = event.target.closest("[data-rent-at]");
      const viewButton = event.target.closest("[data-view]");
      const filterButton = event.target.closest("[data-filter]");
      const voteButton = event.target.closest("[data-vote]");
      const maintenanceButton = event.target.closest("[data-maintenance]");
      const actionButton = event.target.closest("[data-action]");

      if (stationButton) { selectedStation = stationButton.dataset.selectStation; render(); }
      else if (rentButton) { selectedStation = rentButton.dataset.rentAt; currentTab = "ride"; render(); }
      else if (viewButton) { stationView = viewButton.dataset.view; render(); }
      else if (filterButton) { routeFilter = filterButton.dataset.filter; render(); }
      else if (voteButton) {
        const id = Number(voteButton.dataset.vote);
        const route = data.routes.find(r => r.id === id);
        if (route && !data.voted.includes(id)) { route.votes++; data.voted.push(id); save(); render(); }
      } else if (maintenanceButton) {
        const bike = data.bikes.find(b => b.id === maintenanceButton.dataset.maintenance);
        if (bike) { bike.status = "Available"; save(); render(); toast(`${bike.id} marked ready.`); }
      } else if (actionButton) {
        const action = actionButton.dataset.action;
        if (action === "start-ride") startRide();
        if (action === "return-ride") returnRide();
        if (action === "report") showReportForm();
        if (action === "admin") { currentTab = "admin"; render(); }
        if (action === "student-view") { currentTab = "profile"; render(); }
        if (action === "reset") {
          localStorage.removeItem("bikeshare-csu");
          data = structuredClone(initialData); selectedStation = data.stations[0].id;
          currentTab = "map"; save(); render(); toast("Demo data reset.");
        }
        if (action === "close-modal") closeModal();
      }
    });

    main.addEventListener("submit", event => {
      if (event.target.id !== "routeForm") return;
      event.preventDefault();
      const form = new FormData(event.target);
      const title = String(form.get("title") || "").trim();
      const start = stationName(String(form.get("start")));
      const end = stationName(String(form.get("end")));
      if (!title) return;
      data.routes.unshift({
        id: Date.now(), title, start, end,
        tags: form.getAll("tags").map(String), votes: 0
      });
      save(); render(); toast("Route shared with the campus community.");
    });

    function showReportForm() {
      showModal(`<h2>Report a problem</h2><p class="muted">Help keep the campus ride network safe.</p>
        <form id="reportForm" class="form-grid">
          <label>What would you like to report?
            <select name="type"><option>Broken bike</option><option>Unsafe road</option><option>Station issue</option><option>Other</option></select></label>
          <label>Where did it happen?<input name="location" placeholder="Station or campus area" required></label>
          <label>Details<textarea name="details" placeholder="Add a few helpful details"></textarea></label>
          <div class="row"><button class="button secondary" type="button" data-action="close-modal">Cancel</button><button class="button" type="submit">Submit report</button></div>
        </form>`);
    }

    document.querySelector("#modal").addEventListener("click", event => {
      if (event.target === document.querySelector("#modal")) closeModal();
    });
    document.querySelector("#modalBody").addEventListener("click", event => {
      if (event.target.closest('[data-action="close-modal"]')) closeModal();
    });
    document.querySelector("#modalBody").addEventListener("submit", event => {
      if (event.target.id !== "reportForm") return;
      event.preventDefault();
      closeModal();
      toast("Thanks — your demo report has been recorded.");
    });

    window.addEventListener("resize", () => { if (currentTab === "admin") drawChart(); });
    save();
    render();
  </script>
</body>
</html>
